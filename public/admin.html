<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Submissions · Resume Connect Admin</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: var(--bg-alt); font-weight: 600; white-space: nowrap; }
    td small { color: var(--muted); display: block; }
    .tag { display: inline-block; background: rgba(0,38,100,0.08); color: var(--navy); padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; margin: 2px 4px 2px 0; }
    .note { max-width: 36ch; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">KSU</span>
        <span class="brand__text"><strong>Resume Connect</strong><span>Admin · Submissions</span></span>
      </a>
      <nav class="topbar__nav"><a href="/">Back to site</a></nav>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <h2>Resume review requests</h2>
      <p class="muted" id="summary">Loading…</p>
      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>Submitted</th><th>Student</th><th>Program</th><th>Requested board members</th><th>Note</th><th>Resume</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const rows = document.getElementById("rows");
    const summary = document.getElementById("summary");
    const td = (content) => { const c = document.createElement("td"); if (typeof content === "string") c.textContent = content; else c.append(content); return c; };

    fetch("/api/admin/submissions", { headers: { "x-admin-token": token } })
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
      .then((list) => {
        summary.textContent = `${list.length} request${list.length === 1 ? "" : "s"} · newest first`;
        for (const s of list) {
          const tr = document.createElement("tr");
          tr.append(td(new Date(s.submittedAt).toLocaleString()));
          const student = document.createElement("div");
          student.textContent = s.student.name;
          const mail = document.createElement("small");
          const a = document.createElement("a"); a.href = `mailto:${s.student.email}`; a.textContent = s.student.email;
          mail.append(a); student.append(mail);
          tr.append(td(student));
          const prog = document.createElement("div");
          prog.textContent = s.student.major || "—";
          const gy = document.createElement("small"); gy.textContent = s.student.gradYear || ""; prog.append(gy);
          tr.append(td(prog));
          const bm = document.createElement("div");
          for (const m of s.boardMembers) {
            const t = document.createElement("span"); t.className = "tag"; t.textContent = m.name; t.title = m.email || ""; bm.append(t);
          }
          tr.append(td(bm));
          const note = document.createElement("div"); note.className = "note"; note.textContent = s.student.message || "—";
          tr.append(td(note));
          const link = document.createElement("a");
          link.href = `/api/admin/resumes/${encodeURIComponent(s.resume.storedName)}?token=${encodeURIComponent(token)}`;
          link.textContent = s.resume.originalName;
          tr.append(td(link));
          rows.append(tr);
        }
      })
      .catch((err) => { summary.textContent = `Couldn't load submissions (${err.message}). Check your admin token.`; });
  </script>
</body>
</html>
