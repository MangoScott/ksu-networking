<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Bookings · Finance Super Week Admin</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: var(--bg-alt); font-weight: 600; white-space: nowrap; }
    td small { color: var(--muted); display: block; }
    td a + a::before { content: " · "; color: var(--muted); }
    .note { max-width: 32ch; white-space: pre-wrap; }
    .kpis { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 20px; padding: 0; list-style: none; }
    .kpis li { background: var(--bg-alt); border-radius: 10px; padding: 10px 16px; }
    .kpis strong { color: var(--navy); font-size: 1.3rem; margin-right: 6px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">KSU</span>
        <span class="brand__text"><strong>Super Week</strong><span>Admin · Bookings</span></span>
      </a>
      <nav class="topbar__nav"><a href="/">Student page</a><a href="/board">Board page</a></nav>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <h2>Resume review bookings</h2>
      <ul class="kpis" id="kpis"></ul>
      <p class="muted" id="summary">Loading…</p>
      <div class="card table-wrap">
        <table>
          <thead>
            <tr><th>Booked</th><th>Student</th><th>Program</th><th>Board member</th><th>Time</th><th>Note</th><th>Links</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="/shared.js"></script>
  <script>
    const fmt = window.fmt, el = fmt.el;
    const token = new URLSearchParams(location.search).get("token") || "";
    const h = { "x-admin-token": token };
    const td = (...kids) => el("td", {}, kids);

    Promise.all([
      fetch("/api/admin/bookings", { headers: h }).then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))),
      fetch("/api/admin/slots", { headers: h }).then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))),
    ])
      .then(([list, slots]) => {
        const open = slots.filter((s) => !s.bookingId).length;
        document.getElementById("kpis").append(
          el("li", {}, [el("strong", { text: list.length }), "bookings"]),
          el("li", {}, [el("strong", { text: open }), "open slots"]),
          el("li", {}, [el("strong", { text: new Set(slots.map((s) => s.memberId)).size }), "board members with times"]),
        );
        document.getElementById("summary").textContent = list.length ? "Newest first." : "No bookings yet.";
        const rows = document.getElementById("rows");
        for (const b of list) {
          const s = b.student;
          rows.append(
            el("tr", {}, [
              td(new Date(b.submittedAt).toLocaleString()),
              td(s.name, el("small", {}, [el("a", { href: `mailto:${s.email}`, text: s.email })])),
              td(s.major || "—", el("small", { text: s.gradYear || "" })),
              td(b.member.name, el("small", { text: b.member.email || "" })),
              td(b.slot ? `${fmt.date(b.slot.date)} · ${fmt.time(b.slot.time)}` : "—", el("small", { text: b.slot ? `${b.slot.durationMinutes} min` : "slot removed" })),
              td(el("div", { class: "note", text: s.message || "—" })),
              td(
                el("a", { href: `/api/admin/resumes/${encodeURIComponent(b.resume.storedName)}?token=${encodeURIComponent(token)}`, text: "Resume" }),
                s.linkedin ? el("a", { href: s.linkedin, target: "_blank", rel: "noopener", text: "LinkedIn" }) : null,
              ),
            ])
          );
        }
      })
      .catch((err) => { document.getElementById("summary").textContent = `Couldn't load bookings (${err.message}). Check your admin token.`; });
  </script>
</body>
</html>
